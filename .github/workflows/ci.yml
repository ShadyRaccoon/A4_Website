name: CI

on:
  push:
    branches: [ main, ci/pipeline ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore a4_backend/a4_backend.Tests/a4_backend.Tests.csproj

    - name: Build
      run: dotnet build a4_backend/a4_backend.Tests/a4_backend.Tests.csproj --no-restore

    - name: Run tests
      run: dotnet test a4_backend/a4_backend.Tests/a4_backend.Tests.csproj --no-build --verbosity normal